[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duet-arranger"
version = "0.4.4"
description = "Turn a song into a playable two-guitar fingerstyle duet with tabs for Atelier"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chingkheinganba Rajkumar" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "mido>=1.3",
  "soundfile>=0.12",
  "librosa>=0.10",
]

[project.optional-dependencies]
# Audio input: source separation (Demucs) + transcription (Basic Pitch on ONNX runtime).
audio = [
  "torch>=2.1",
  "torchaudio>=2.1",
  "demucs>=4.0",
  "basic-pitch>=0.4",
  "onnxruntime>=1.16",
  "pretty_midi>=0.2.10",
  "resampy>=0.4",
  "mir_eval>=0.7",
  "scikit-learn>=1.3",
]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
duet-arranger = "duet_arranger.cli:main"
stem-studio = "stem_studio.cli:main"

[tool.setuptools.packages.find]
include = ["duet_arranger*", "stem_studio*"]

[tool.setuptools.package-data]
"duet_arranger.web" = ["static/*"]
"stem_studio" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
